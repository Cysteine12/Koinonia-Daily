name: Mobile CI

on:
  push:
    branches: ["main", "develop"]
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-ci.yml"
  pull_request:
    branches: ["main", "develop"]
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-ci.yml"
  workflow_dispatch:

concurrency:
  group: mobile-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Run Mobile CI Checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: mobile/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typescript check
        run: pnpm exec tsc --noEmit

      - name: Lint
        run: pnpm exec expo lint

      - name: Prettier check
        run: pnpm exec prettier --check "**/*.{js,ts,jsx,tsx,json,md}"
        continue-on-error: true

      - name: Expo config validation
        run: pnpm exec expo config --type public

      - name: Clean Expo internal files
        run: rm -rf .expo

      - name: Expo doctor
        run: CI=1 npx expo-doctor
  preview:
    name: Run Mobile Preview Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [checks]
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'

    defaults:
      run:
        working-directory: mobile

    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: mobile/pnpm-lock.yaml

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          expo-token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check OTA safety
        run: |
          pnpm exec expo prebuild --no-install
          git diff --exit-code
        continue-on-error: false

      - name: Install EAS CLI
        run: pnpm add -g eas-cli@20.4.0

      - name: Publish Expo OTA update
        run: |
          eas update --branch preview --message "preview: ${{ github.sha }}"

  production:
    name: Run Mobile Production Build
    runs-on: ubuntu-latest
    needs: [checks]
    timeout-minutes: 60
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'

    defaults:
      run:
        working-directory: mobile

    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: mobile/pnpm-lock.yaml

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          expo-token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check OTA safety
        run: |
          pnpm exec expo prebuild --no-install
          git diff --exit-code
        continue-on-error: false

      - name: Install EAS CLI
        run: pnpm add -g eas-cli@20.4.0

      - name: Publish Expo OTA update
        run: |
          eas update --branch production --message "production: ${{ github.sha }}" --no-wait

      - name: Build production apps
        run: eas build --platform all --profile production --non-interactive


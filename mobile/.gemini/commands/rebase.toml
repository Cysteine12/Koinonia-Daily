description = "Synchronizes the current branch with 'develop' using autostash."

prompt = """
# Context: Current Git State
- **Current Branch:** !{git branch --show-current}
- **Working Tree Status:**
```
!{git status --porcelain}
```

# Task: Synchronized Rebase (with Autostash)
1.  **Update Base Branch:**
    - Switch to the base branch: `git checkout develop`
    - Pull latest changes: `git pull origin develop`
2.  **Execute Rebase with Autostash:**
    - Switch back to the original branch (identified in the Context section).
    - Run: `git rebase --autostash develop`

# Guidelines
- Use the `run_shell_command` tool for all git operations.
- **Autostash Benefit:** Git will automatically stash your changes before the rebase and pop them back once the rebase is finished.
- **Stop on Errors:** If a rebase conflict occurs or any command fails, STOP immediately and ask me for instructions.
- **Confirmation:** Provide a brief summary of the steps taken once completed.
"""

spring.datasource.url=${DB_URL:?DB_URL must be set}
spring.datasource.username=${DB_USERNAME:?DB_USERNAME must be set}
spring.datasource.password=${DB_PASSWORD:?DB_PASSWORD must be set}
spring.sql.init.mode=never
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

app.jwt.secret=${JWT_SECRET:?JWT_SECRET must be set}
app.aws.access-key=${AWS_ACCESS_KEY:?AWS_ACCESS_KEY must be set}
app.aws.secret-key=${AWS_SECRET_KEY:?AWS_SECRET_KEY must be set}
app.aws.region=${AWS_REGION:?AWS_REGION must be set}
app.aws.ses-from-email=${AWS_SES_FROM_EMAIL:?AWS_SES_FROM_EMAIL must be set}
app.aws.s3-bucket-name=${AWS_S3_BUCKET_NAME:?AWS_S3_BUCKET_NAME must be set}

# Sentry settings for production
sentry.dsn=${SENTRY_DSN:?SENTRY_DSN must be set}
sentry.environment=production
sentry.send-default-pii=false
sentry.traces-sample-rate=0.1
sentry.logging.enabled=true
sentry.enable-tracing=true

sentry.max-breadcrumbs=100
sentry.max-cache-items=30
sentry.attach-stacktrace=true
sentry.attach-threads=false
sentry.logging.minimum-breadcrumb-level=info
sentry.logging.minimum-event-level=error

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
management.info.env.enabled=false
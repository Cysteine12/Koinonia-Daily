spring.application.name=Koinonia-Daily

spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
spring.profiles.include=local

spring.jpa.open-in-view=false

spring.jackson.datatype.datetime.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC

logging.level.org.springframework.boot.context.config=INFO

app.mailtrap.host=live.smtp.mailtrap.io
app.mailtrap.port=587

sentry.dsn=${SENTRY_DSN:}
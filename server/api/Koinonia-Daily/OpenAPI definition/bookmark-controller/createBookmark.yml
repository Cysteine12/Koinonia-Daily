info:
  name: createBookmark
  type: http
  seq: 2
  tags:
    - bookmark-controller

http:
  method: POST
  url: "{{baseUrl}}/api/v1/bookmarks"
  body:
    type: json
    data: |-
      {
        "teachingId": 0,
        "categoryId": 0,
        "note": ""
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:

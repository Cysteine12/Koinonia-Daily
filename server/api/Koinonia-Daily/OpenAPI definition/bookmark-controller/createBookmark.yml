    description: OK
    request:
      url: "{{baseUrl}}/api/v1/bookmarks"
      method: POST
      body:
        type: json
        data: |-
          {
            "teachingId": 0,
            "categoryId": 0,
            "note": ""
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: "*/*"
      body:
        type: text
        data: |-
          {
            "success": false,
            "message": "",
            "data": ""
          }

info:
  name: getRecommendations
  type: http
  seq: 1
  tags:
    - recommendation-controller

http:
  method: GET
  url: "{{baseUrl}}/api/v1/recommendations/:teachingId"
  params:
    - name: teachingId
      value: ""
      type: path
    - name: size
      value: "10"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:

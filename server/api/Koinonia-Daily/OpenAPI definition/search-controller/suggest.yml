info:
  name: suggest
  type: http
  seq: 3
  tags:
    - search-controller

http:
  method: GET
  url: "{{baseUrl}}/api/v1/search/suggestions?query=SUPERNATURAL&page=0&size=50"
  params:
    - name: query
      value: SUPERNATURAL
      type: query
    - name: page
      value: "0"
      type: query
    - name: size
      value: "50"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{baseUrl}}/api/v1/search/suggestions"
      method: GET
      params:
        - name: query
          value: ""
          type: query
        - name: page
          value: "0"
          type: query
        - name: size
          value: "50"
          type: query
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: "*/*"
      body:
        type: text
        data: |-
          {
            "success": true,
            "data": [
              {
                "id": 0,
                "title": "",
                "thumbnailUrl": "",

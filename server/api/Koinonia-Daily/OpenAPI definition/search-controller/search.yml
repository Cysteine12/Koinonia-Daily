          type: query
        - name: page
          value: "0"
          type: query
        - name: size
          value: "50"
          type: query
        - name: semantic
          value: "false"
          type: query
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: "*/*"

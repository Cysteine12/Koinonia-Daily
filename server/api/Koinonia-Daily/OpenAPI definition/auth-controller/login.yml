info:
  name: login
  type: http
  seq: 7
  tags:
    - auth-controller

http:
  method: POST
  url: "{{baseUrl}}/api/v1/auth/login"
  body:
    type: json
    data: |-
      {
        "email": "testuser@gmail.com",
        "password": "test1234"
      }
  auth: inherit

runtime:
  variables:
    - name: baseUrl
      value: http://localhost:8080
  scripts:
    - type: after-response
      code: |-
        let ACCESS_TOKEN = res.body.data.accessToken;
        let REFRESH_TOKEN = res.body.data.refreshToken;

        bru.setEnvVar("token", ACCESS_TOKEN);
        bru.setEnvVar("ACCESS_TOKEN", ACCESS_TOKEN);
        bru.setEnvVar("REFRESH_TOKEN", REFRESH_TOKEN);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{baseUrl}}/api/v1/auth/login"
      method: POST
      body:
        type: json
        data: |-
          {
            "email": "",
            "password": ""
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: "*/*"
      body:
        type: text
        data: |-
          {
            "success": true,
            "message": "",
            "data": {
              "accessToken": "",
              "refreshToken": ""
            }
          }

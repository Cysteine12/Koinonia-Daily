info:
  name: getAccountProfile
  type: http
  seq: 1
  tags:
    - account-controller

http:
  method: GET
  url: "{{baseUrl}}/api/v1/account/profile"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{baseUrl}}/api/v1/account/profile"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: "*/*"
      body:
        type: text
        data: |-
          {
            "success": true,
            "data": {
              "id": 0,
              "firstName": "",
              "lastName": "",
              "email": "",
              "photoUrl": "",
              "role": "USER",
              "createdAt": "",
              "updatedAt": ""
            }
          }

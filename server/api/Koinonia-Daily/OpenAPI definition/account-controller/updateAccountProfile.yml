    description: OK
    request:
      url: "{{baseUrl}}/api/v1/account/profile"
      method: PATCH
      body:
        type: json
        data: |-
          {
            "firstName": "",
            "lastName": "",
            "photoUrl": ""
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: "*/*"
      body:
        type: text
        data: |-
          {
            "success": false,
            "message": "",
            "data": {
              "id": 0,
              "firstName": "",
              "lastName": "",
              "email": "",
              "photoUrl": "",
              "role": "USER",
              "createdAt": "",
              "updatedAt": ""
            }
          }

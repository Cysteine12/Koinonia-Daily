info:
  name: updateAccountProfile
  type: http
  seq: 2
  tags:
    - account-controller

http:
  method: PATCH
  url: "{{baseUrl}}/api/v1/account/profile"
  body:
    type: json
    data: |-
      {
        "firstName": "",
        "lastName": "",
        "photoUrl": ""
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:

      type: path
    - name: status
      value: CHUNKED
      type: path
      disabled: true
    - name: status
      value: EMBEDDING
      type: path
      disabled: true
    - name: status
      value: EMBEDDED
      type: path
      disabled: true
    - name: status
      value: FAILED
      type: path
      disabled: true
    - name: page
      value: "0"
      type: query
    - name: size
      value: "50"
      type: query
  auth: inherit

